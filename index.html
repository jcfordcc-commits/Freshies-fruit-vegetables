<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Vision Classifier — Teachable Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-base: #0b0f17;
      --bg-elevated: #121826;
      --bg-subtle: #182134;
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-accent: rgba(52, 211, 153, 0.45);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #34d399;
      --accent-secondary: #38bdf8;
      --accent-glow: rgba(52, 211, 153, 0.16);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2.5rem;
      --space-xl: 4rem;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(52, 211, 153, 0.08), transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.08), transparent 45%);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 var(--space-md);
    }

    /* Header & Hierarchy */
    header {
      padding: var(--space-xl) 0 var(--space-lg);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid var(--border-accent);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      margin-bottom: var(--space-sm);
    }

    h1 {
      font-size: clamp(2rem, 4.5vw, 3.15rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: var(--space-sm);
    }

    h1 span {
      background: linear-gradient(120deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      max-width: 620px;
      margin: 0 auto;
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    /* Main Interactive Studio */
    .studio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
      align-items: start;
    }

    @media (max-width: 820px) {
      .studio-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-sm);
      padding-bottom: var(--space-xs);
      border-bottom: 1px solid var(--border-subtle);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
    }

    .status-pill.active {
      color: var(--accent);
      background: var(--accent-glow);
    }

    /* Viewport */
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--bg-subtle);
      border: 1px dashed rgba(148, 163, 184, 0.28);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: var(--space-sm);
    }

    .viewport canvas,
    .viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius-md);
    }

    .placeholder-msg {
      text-align: center;
      padding: var(--space-md);
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    /* Controls (Proximity & Repetition) */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
    }

    button,
    .upload-btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      padding: 0.7rem 1.15rem;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border: 1px solid transparent;
    }

    button:active,
    .upload-btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #052e16;
    }

    .btn-primary:hover {
      background: #6ee7b7;
    }

    .btn-secondary,
    .upload-btn {
      flex: 1;
      background: var(--bg-subtle);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    .btn-secondary:hover,
    .upload-btn:hover {
      border-color: rgba(148, 163, 184, 0.4);
      background: #202b42;
    }

    input[type="file"] {
      display: none;
    }

    /* Predictions */
    .top-result {
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.12), rgba(56, 189, 248, 0.08));
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      margin-bottom: var(--space-md);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .top-label-group span {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      font-weight: 700;
    }

    .top-label {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .top-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
    }

    .predictions-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .prediction-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .prediction-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .prediction-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .prediction-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .bar-track {
      width: 100%;
      height: 10px;
      background: var(--bg-subtle);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
      transition: width 0.2s ease-out;
    }

    /* Community Significance Section */
    .community-section {
      margin-top: var(--space-xl);
      padding-bottom: var(--space-xl);
    }

    .section-head {
      margin-bottom: var(--space-md);
    }

    .section-head h2 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .section-head p {
      color: var(--text
